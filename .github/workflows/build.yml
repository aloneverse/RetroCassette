package com.retro.cassettewidget;
import android.app.Activity;
import android.content.ComponentName;
import android.content.Intent;
import android.graphics.Color;
import android.os.Bundle;
import android.provider.Settings;
import android.text.TextUtils;
import android.view.Gravity;
import android.view.View;
import android.widget.Button;
import android.widget.LinearLayout;
import android.widget.TextView;
public class MainActivity extends Activity {
private TextView statusText;
@Override
protected void onCreate(Bundle savedInstanceState) {
super.onCreate(savedInstanceState);
LinearLayout layout = new LinearLayout(this);
layout.setOrientation(LinearLayout.VERTICAL);
layout.setGravity(Gravity.CENTER);
layout.setBackgroundColor(Color.parseColor("#141210"));
layout.setPadding(48, 48, 48, 48);
TextView title = new TextView(this);
title.setText("RETRO DARK CASSETTE");
title.setTextSize(22f);
title.setTextColor(Color.parseColor("#E5A93C"));
title.setGravity(Gravity.CENTER);
title.setPadding(0, 0, 0, 24);
TextView desc = new TextView(this);
desc.setText("Gane ka album photo aur ghumti hui cassette chalane ke liye Notification Access allow karein.\n\nPhir Home Screen par jaakar 'Retro Walkman Cassette' widget lagayein!");
desc.setTextSize(14f);
desc.setTextColor(Color.parseColor("#F2E6D8"));
desc.setGravity(Gravity.CENTER);
desc.setPadding(0, 0, 0, 36);
statusText = new TextView(this);
statusText.setTextSize(14f);
statusText.setGravity(Gravity.CENTER);
statusText.setPadding(0, 0, 0, 24);
Button permButton = new Button(this);
permButton.setText("1. GRANT MUSIC SYNC PERMISSION");
permButton.setBackgroundColor(Color.parseColor("#C8641E"));
permButton.setTextColor(Color.parseColor("#141210"));
permButton.setOnClickListener(new View.OnClickListener() {
@Override
public void onClick(View v) {
startActivity(new Intent(Settings.ACTION_NOTIFICATION_LISTENER_SETTINGS));
}
});
layout.addView(title);
layout.addView(desc);
layout.addView(statusText);
layout.addView(permButton);
setContentView(layout);
}
@Override
protected void onResume() {
super.onResume();
if (isNotificationServiceEnabled()) {
statusText.setText("Connected! Ab Home Screen par Widget lagayein.");
statusText.setTextColor(Color.parseColor("#6BCB77"));
} else {
statusText.setText("Permission Pending");
statusText.setTextColor(Color.parseColor("#E5A93C"));
}
}
private boolean isNotificationServiceEnabled() {
String flat = Settings.Secure.getString(getContentResolver(), "enabled_notification_listeners");
if (!TextUtils.isEmpty(flat)) {
String[] names = flat.split(":");
for (String name : names) {
ComponentName cn = ComponentName.unflattenFromString(name);
if (cn != null && TextUtils.equals(getPackageName(), cn.getPackageName())) {
return true;
}
}
}
return false;
}
}
EOFcat << 'EOF' > app/src/main/java/com/retro/cassettewidget/MusicNotificationListener.java
package com.retro.cassettewidget;
import android.appwidget.AppWidgetManager;
import android.content.ComponentName;
import android.content.Context;
import android.graphics.Bitmap;
import android.graphics.Canvas;
import android.graphics.Matrix;
import android.graphics.drawable.Drawable;
import android.media.MediaMetadata;
import android.media.session.MediaController;
import android.media.session.MediaSessionManager;
import android.media.session.PlaybackState;
import android.os.Handler;
import android.os.Looper;
import android.service.notification.NotificationListenerService;
import android.widget.RemoteViews;
import java.util.List;
public class MusicNotificationListener extends NotificationListenerService {
public static MediaController activeController = null;
public static String currentTitle = "NO CASSETTE INSERTED";
public static String currentArtist = "Tap to open music app";
public static Bitmap currentAlbumArt = null;
public static boolean isPlaying = false;
public static String currentPackage = null;
private MediaSessionManager sessionManager;
private final Handler handler = new Handler(Looper.getMainLooper());
private float reelAngle = 0f;
private final Runnable spinRunnable = new Runnable() {
@Override
public void run() {
if (isPlaying) {
reelAngle = (reelAngle + 15f) % 360f;
updateAllWidgets();
handler.postDelayed(this, 120);
}
}
};
private final MediaSessionManager.OnActiveSessionsChangedListener sessionsListener =
new MediaSessionManager.OnActiveSessionsChangedListener() {
@Override
public void onActiveSessionsChanged(List<MediaController> controllers) {
attachToActiveSession(controllers);
}
};
@Override
public void onListenerConnected() {
super.onListenerConnected();
sessionManager = (MediaSessionManager) getSystemService(Context.MEDIA_SESSION_SERVICE);
ComponentName component = new ComponentName(this, MusicNotificationListener.class);
try {
sessionManager.addOnActiveSessionsChangedListener(sessionsListener, component);
attachToActiveSession(sessionManager.getActiveSessions(component));
} catch (SecurityException e) {
e.printStackTrace();
}
}
private void attachToActiveSession(List<MediaController> controllers) {
if (controllers == null || controllers.isEmpty()) return;
MediaController controller = controllers.get(0);
activeController = controller;
currentPackage = controller.getPackageName();
updateMetadata(controller.getMetadata());
updatePlaybackState(controller.getPlaybackState());
controller.registerCallback(new MediaController.Callback() {
@Override
public void onMetadataChanged(MediaMetadata metadata) {
updateMetadata(metadata);
}
@Override
public void onPlaybackStateChanged(PlaybackState state) {
updatePlaybackState(state);
}
});
}
private void updateMetadata(MediaMetadata metadata) {
if (metadata != null) {
String t = metadata.getString(MediaMetadata.METADATA_KEY_TITLE);
String a = metadata.getString(MediaMetadata.METADATA_KEY_ARTIST);
currentTitle = (t != null) ? t : "UNKNOWN TRACK";
currentArtist = (a != null) ? a : "Retro Stereo";
Bitmap rawArt = metadata.getBitmap(MediaMetadata.METADATA_KEY_ALBUM_ART);
if (rawArt == null) {
rawArt = metadata.getBitmap(MediaMetadata.METADATA_KEY_ART);
}
currentAlbumArt = (rawArt != null) ? Bitmap.createScaledBitmap(rawArt, 140, 140, true) : null;
}
updateAllWidgets();
}
private void updatePlaybackState(PlaybackState state) {
boolean playingNow = (state != null && state.getState() == PlaybackState.STATE_PLAYING);
if (playingNow && !isPlaying) {
isPlaying = true;
handler.removeCallbacks(spinRunnable);
handler.post(spinRunnable);
} else if (!playingNow) {
isPlaying = false;
handler.removeCallbacks(spinRunnable);
updateAllWidgets();
}
}
private void updateAllWidgets() {
AppWidgetManager appWidgetManager = AppWidgetManager.getInstance(this);
ComponentName widgetComponent = new ComponentName(this, CassetteWidgetProvider.class);
int[] widgetIds = appWidgetManager.getAppWidgetIds(widgetComponent);
Bitmap rotatedReel = getRotatedReelBitmap(reelAngle);
for (int widgetId : widgetIds) {
RemoteViews views = new RemoteViews(getPackageName(), R.layout.widget_cassette);
views.setTextViewText(R.id.tv_song_title, currentTitle.toUpperCase());
views.setTextViewText(R.id.tv_artist_name, currentArtist);
if (currentAlbumArt != null) {
views.setImageViewBitmap(R.id.iv_album_art, currentAlbumArt);
} else {
views.setImageViewResource(R.id.iv_album_art, R.drawable.ic_default_album);
}
if (rotatedReel != null) {
views.setImageViewBitmap(R.id.iv_reel_left, rotatedReel);
views.setImageViewBitmap(R.id.iv_reel_right, rotatedReel);
}
CassetteWidgetProvider.setupClickIntents(this, views);
appWidgetManager.updateAppWidget(widgetId, views);
}
}
private Bitmap getRotatedReelBitmap(float angle) {
Drawable drawable = getDrawable(R.drawable.ic_cassette_reel);
if (drawable == null) return null;
int size = 96;
Bitmap baseBitmap = Bitmap.createBitmap(size, size, Bitmap.Config.ARGB_8888);
Canvas canvas = new Canvas(baseBitmap);
drawable.setBounds(0, 0, size, size);
drawable.draw(canvas);
Matrix matrix = new Matrix();
matrix.postRotate(angle, size / 2f, size / 2f);
return Bitmap.createBitmap(baseBitmap, 0, 0, size, size, matrix, true);
}
}
