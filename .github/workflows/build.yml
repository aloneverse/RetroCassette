package com.retro.cassettewidget;
import android.app.Activity;
import android.content.ComponentName;
import android.content.Intent;
import android.graphics.Color;
import android.os.Bundle;
import android.provider.Settings;
import android.text.TextUtils;
import android.view.Gravity;
import android.view.View;
import android.widget.Button;
import android.widget.LinearLayout;
import android.widget.TextView;
public class MainActivity extends Activity {
private TextView statusText;
@Override
protected void onCreate(Bundle savedInstanceState) {
super.onCreate(savedInstanceState);
LinearLayout layout = new LinearLayout(this);
layout.setOrientation(LinearLayout.VERTICAL);
layout.setGravity(Gravity.CENTER);
layout.setBackgroundColor(Color.parseColor("#14110F"));
layout.setPadding(48, 48, 48, 48);
TextView title = new TextView(this);
title.setText("RETRO DARK CASSETTE");
title.setTextSize(22f);
title.setTextColor(Color.parseColor("#E59838"));
title.setGravity(Gravity.CENTER);
title.setPadding(0, 0, 0, 24);
TextView desc = new TextView(this);
desc.setText("Gane ka album photo aur ghumti hui cassette chalane ke liye Notification Access allow karein.\n\nPhir Home Screen par jaakar 'Retro Walkman Cassette' widget lagayein!");
desc.setTextSize(14f);
desc.setTextColor(Color.parseColor("#F5E6C8"));
desc.setGravity(Gravity.CENTER);
desc.setPadding(0, 0, 0, 36);
statusText = new TextView(this);
statusText.setTextSize(14f);
statusText.setGravity(Gravity.CENTER);
statusText.setPadding(0, 0, 0, 24);
Button btn = new Button(this);
btn.setText("1. GRANT MUSIC SYNC PERMISSION");
btn.setBackgroundColor(Color.parseColor("#D96B27"));
btn.setTextColor(Color.parseColor("#14110F"));
btn.setOnClickListener(new View.OnClickListener() {
@Override public void onClick(View v) { startActivity(new Intent(Settings.ACTION_NOTIFICATION_LISTENER_SETTINGS)); }
});
layout.addView(title); layout.addView(desc); layout.addView(statusText); layout.addView(btn);
setContentView(layout);
}
@Override
protected void onResume() {
super.onResume();
String flat = Settings.Secure.getString(getContentResolver(), "enabled_notification_listeners");
boolean ok = false;
if (!TextUtils.isEmpty(flat)) {
for (String n : flat.split(":")) {
ComponentName cn = ComponentName.unflattenFromString(n);
if (cn != null && TextUtils.equals(getPackageName(), cn.getPackageName())) { ok = true; break; }
}
}
statusText.setText(ok ? "Connected! Ab Home Screen par Widget lagayein." : "Permission Pending");
statusText.setTextColor(Color.parseColor(ok ? "#6BCB77" : "#E59838"));
}
}
