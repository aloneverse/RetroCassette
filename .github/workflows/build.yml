cat << 'EOF' > app/src/main/java/com/retro/cassettewidget/CassetteRenderer.java
package com.retro.cassettewidget;
import android.graphics.Bitmap;
import android.graphics.Canvas;
import android.graphics.Color;
import android.graphics.Paint;
import android.graphics.RectF;
public class CassetteRenderer {
public static Bitmap renderCassette(float angle, boolean playing) {
int w = 520, h = 260;
Bitmap bmp = Bitmap.createBitmap(w, h, Bitmap.Config.ARGB_8888);
Canvas c = new Canvas(bmp);
Paint p = new Paint(Paint.ANTI_ALIAS_FLAG);
p.setColor(Color.parseColor("#171412"));
c.drawRoundRect(new RectF(2, 2, w - 2, h - 2), 26, 26, p);
p.setStyle(Paint.Style.STROKE);
p.setStrokeWidth(3f);
p.setColor(Color.parseColor("#3E362F"));
c.drawRoundRect(new RectF(2, 2, w - 2, h - 2), 26, 26, p);
p.setStyle(Paint.Style.FILL);
p.setColor(Color.parseColor("#241F1B"));
c.drawRoundRect(new RectF(16, 14, w - 16, 86), 14, 14, p);
p.setStyle(Paint.Style.STROKE);
p.setStrokeWidth(2f);
p.setColor(Color.parseColor("#8C5523"));
c.drawRoundRect(new RectF(16, 14, w - 16, 86), 14, 14, p);
p.setStyle(Paint.Style.FILL);
p.setColor(Color.parseColor("#0D0B0A"));
c.drawRoundRect(new RectF(64, 98, w - 64, 192), 18, 18, p);
p.setStyle(Paint.Style.STROKE);
p.setStrokeWidth(2.5f);
p.setColor(Color.parseColor("#544B42"));
c.drawRoundRect(new RectF(64, 98, w - 64, 192), 18, 18, p);
p.setStyle(Paint.Style.FILL);
p.setColor(Color.parseColor("#3A2518"));
c.drawRect(155, 141, w - 155, 149, p);
drawReel(c, 155, 145, angle);
drawReel(c, w - 155, 145, angle);
p.setColor(Color.parseColor("#4A423B"));
float[] sx = {16, w - 16, 16, w - 16};
float[] sy = {16, 16, h - 16, h - 16};
for (int i = 0; i < 4; i++) c.drawCircle(sx[i], sy[i], 5f, p);
p.setColor(Color.parseColor(playing ? "#6BCB77" : "#554D46"));
c.drawCircle(w - 32, 50, 6f, p);
return bmp;
}
private static void drawReel(Canvas c, float cx, float cy, float angle) {
Paint p = new Paint(Paint.ANTI_ALIAS_FLAG);
p.setColor(Color.parseColor("#3D281A"));
c.drawCircle(cx, cy, 38f, p);
p.setColor(Color.parseColor("#F2E6D0"));
c.drawCircle(cx, cy, 23f, p);
p.setColor(Color.parseColor("#D96B27"));
p.setStrokeWidth(4f);
for (int i = 0; i < 6; i++) {
double rad = Math.toRadians(angle + i * 60);
c.drawLine(cx + (float) Math.cos(rad) * 10f, cy + (float) Math.sin(rad) * 10f,
cx + (float) Math.cos(rad) * 22f, cy + (float) Math.sin(rad) * 22f, p);
}
p.setColor(Color.parseColor("#0D0B0A"));
c.drawCircle(cx, cy, 10f, p);
}
public static Bitmap defaultArt() {
Bitmap b = Bitmap.createBitmap(96, 96, Bitmap.Config.ARGB_8888);
Canvas c = new Canvas(b);
Paint p = new Paint(Paint.ANTI_ALIAS_FLAG);
p.setColor(Color.parseColor("#14110F"));
c.drawRect(0, 0, 96, 96, p);
p.setColor(Color.parseColor("#383029"));
c.drawCircle(48, 48, 36, p);
p.setColor(Color.parseColor("#D96B27"));
c.drawCircle(48, 48, 12, p);
p.setColor(Color.parseColor("#14110F"));
c.drawCircle(48, 48, 4, p);
return b;
}
}
