name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup & Build APK
        run: |
          chmod +x setup.sh
          ./setup.sh
          sed -i 's/compileSdk 34/compileSdk 35/g' app/build.gradle
          sed -i 's/targetSdk 34/targetSdk 35/g' app/build.gradle
          sed -i '/material/d' app/build.gradle
          sed -i 's/Theme.MaterialComponents.DayNight.NoActionBar/Theme.AppCompat.NoActionBar/g' app/src/main/AndroidManifest.xml
          wget -q https://services.gradle.org/distributions/gradle-8.5-bin.zip
          unzip -q gradle-8.5-bin.zip
          ./gradle-8.5/bin/gradle wrapper --gradle-version 8.5
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Retro-Cassette-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          
