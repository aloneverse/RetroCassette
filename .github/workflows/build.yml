cat << 'EOF' > app/src/main/java/com/retro/cassettewidget/CassetteWidgetProvider.java
package com.retro.cassettewidget;
import android.app.PendingIntent;
import android.appwidget.AppWidgetManager;
import android.appwidget.AppWidgetProvider;
import android.content.Context;
import android.content.Intent;
import android.widget.RemoteViews;
public class CassetteWidgetProvider extends AppWidgetProvider {
public static final String ACTION_PLAY_PAUSE = "com.retro.cassettewidget.ACTION_PLAY_PAUSE";
public static final String ACTION_NEXT = "com.retro.cassettewidget.ACTION_NEXT";
public static final String ACTION_OPEN_APP = "com.retro.cassettewidget.ACTION_OPEN_APP";
public static void setupClickIntents(Context context, RemoteViews views) {
int flags = PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE;
Intent openIntent = new Intent(context, CassetteWidgetProvider.class);
openIntent.setAction(ACTION_OPEN_APP);
PendingIntent openPending = PendingIntent.getBroadcast(context, 0, openIntent, flags);
views.setOnClickPendingIntent(R.id.widget_root, openPending);
views.setOnClickPendingIntent(R.id.btn_open_app, openPending);
Intent playPauseIntent = new Intent(context, CassetteWidgetProvider.class);
playPauseIntent.setAction(ACTION_PLAY_PAUSE);
PendingIntent playPausePending = PendingIntent.getBroadcast(context, 1, playPauseIntent, flags);
views.setOnClickPendingIntent(R.id.btn_play_pause, playPausePending);
Intent nextIntent = new Intent(context, CassetteWidgetProvider.class);
nextIntent.setAction(ACTION_NEXT);
PendingIntent nextPending = PendingIntent.getBroadcast(context, 2, nextIntent, flags);
views.setOnClickPendingIntent(R.id.btn_next, nextPending);
}
@Override
public void onUpdate(Context context, AppWidgetManager appWidgetManager, int[] appWidgetIds) {
for (int appWidgetId : appWidgetIds) {
RemoteViews views = new RemoteViews(context.getPackageName(), R.layout.widget_cassette);
views.setTextViewText(R.id.tv_song_title, MusicNotificationListener.currentTitle);
views.setTextViewText(R.id.tv_artist_name, MusicNotificationListener.currentArtist);
if (MusicNotificationListener.currentAlbumArt != null) {
views.setImageViewBitmap(R.id.iv_album_art, MusicNotificationListener.currentAlbumArt);
} else {
views.setImageViewResource(R.id.iv_album_art, R.drawable.ic_default_album);
}
setupClickIntents(context, views);
appWidgetManager.updateAppWidget(appWidgetId, views);
}
}
@Override
public void onReceive(Context context, Intent intent) {
super.onReceive(context, intent);
String action = intent.getAction();
if (action == null) return;
if (ACTION_PLAY_PAUSE.equals(action)) {
if (MusicNotificationListener.activeController != null) {
if (MusicNotificationListener.isPlaying) {
MusicNotificationListener.activeController.getTransportControls().pause();
} else {
MusicNotificationListener.activeController.getTransportControls().play();
}
}
} else if (ACTION_NEXT.equals(action)) {
if (MusicNotificationListener.activeController != null) {
MusicNotificationListener.activeController.getTransportControls().skipToNext();
}
} else if (ACTION_OPEN_APP.equals(action)) {
String pkg = MusicNotificationListener.currentPackage;
Intent launchIntent = null;
if (pkg != null) {
launchIntent = context.getPackageManager().getLaunchIntentForPackage(pkg);
}
if (launchIntent == null) {
launchIntent = Intent.makeMainSelectorActivity(Intent.ACTION_MAIN, Intent.CATEGORY_APP_MUSIC);
}
if (launchIntent != null) {
launchIntent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
try {
context.startActivity(launchIntent);
} catch (Exception ignored) {}
}
}
}
}
