cat << 'EOF' > app/src/main/java/com/retro/cassettewidget/MusicNotificationListener.java
package com.retro.cassettewidget;
import android.appwidget.AppWidgetManager;
import android.content.ComponentName;
import android.content.Context;
import android.graphics.Bitmap;
import android.media.MediaMetadata;
import android.media.session.MediaController;
import android.media.session.MediaSessionManager;
import android.media.session.PlaybackState;
import android.os.Handler;
import android.os.Looper;
import android.service.notification.NotificationListenerService;
import android.widget.RemoteViews;
import java.util.List;
public class MusicNotificationListener extends NotificationListenerService {
public static MediaController activeController = null;
public static String currentTitle = "TAP TO OPEN MUSIC";
public static String currentArtist = "SIDE A • CHROME 90";
public static Bitmap currentAlbumArt = null;
public static boolean isPlaying = false;
public static String currentPackage = null;
private MediaSessionManager sessionManager;
private final Handler handler = new Handler(Looper.getMainLooper());
private float reelAngle = 0f;
private final Runnable spinRunnable = new Runnable() {
@Override public void run() {
if (isPlaying) { reelAngle = (reelAngle + 15f) % 360f; updateAllWidgets(); handler.postDelayed(this, 130); }
}
};
private final MediaSessionManager.OnActiveSessionsChangedListener sessionsListener = new MediaSessionManager.OnActiveSessionsChangedListener() {
@Override public void onActiveSessionsChanged(List<MediaController> c) { attach(c); }
};
@Override
public void onListenerConnected() {
super.onListenerConnected();
sessionManager = (MediaSessionManager) getSystemService(Context.MEDIA_SESSION_SERVICE);
ComponentName cn = new ComponentName(this, MusicNotificationListener.class);
try {
sessionManager.addOnActiveSessionsChangedListener(sessionsListener, cn);
attach(sessionManager.getActiveSessions(cn));
} catch (SecurityException ignored) {}
}
private void attach(List<MediaController> list) {
if (list == null || list.isEmpty()) return;
MediaController mc = list.get(0);
activeController = mc;
currentPackage = mc.getPackageName();
updateMeta(mc.getMetadata());
updateState(mc.getPlaybackState());
mc.registerCallback(new MediaController.Callback() {
@Override public void onMetadataChanged(MediaMetadata m) { updateMeta(m); }
@Override public void onPlaybackStateChanged(PlaybackState s) { updateState(s); }
});
}
private void updateMeta(MediaMetadata m) {
if (m != null) {
String t = m.getString(MediaMetadata.METADATA_KEY_TITLE);
String a = m.getString(MediaMetadata.METADATA_KEY_ARTIST);
currentTitle = (t != null) ? t : "UNKNOWN TRACK";
currentArtist = (a != null) ? a : "Retro Stereo";
Bitmap art = m.getBitmap(MediaMetadata.METADATA_KEY_ALBUM_ART);
if (art == null) art = m.getBitmap(MediaMetadata.METADATA_KEY_ART);
currentAlbumArt = (art != null) ? Bitmap.createScaledBitmap(art, 100, 100, true) : null;
}
updateAllWidgets();
}
private void updateState(PlaybackState s) {
boolean play = (s != null && s.getState() == PlaybackState.STATE_PLAYING);
if (play && !isPlaying) { isPlaying = true; handler.removeCallbacks(spinRunnable); handler.post(spinRunnable); }
else if (!play) { isPlaying = false; handler.removeCallbacks(spinRunnable); updateAllWidgets(); }
}
private void updateAllWidgets() {
AppWidgetManager mgr = AppWidgetManager.getInstance(this);
int[] ids = mgr.getAppWidgetIds(new ComponentName(this, CassetteWidgetProvider.class));
Bitmap bg = CassetteRenderer.renderCassette(reelAngle, isPlaying);
Bitmap art = (currentAlbumArt != null) ? currentAlbumArt : CassetteRenderer.defaultArt();
for (int id : ids) {
RemoteViews v = new RemoteViews(getPackageName(), R.layout.widget_cassette);
v.setImageViewBitmap(R.id.iv_cassette_bg, bg);
v.setImageViewBitmap(R.id.iv_album_art, art);
v.setTextViewText(R.id.tv_song_title, currentTitle.toUpperCase());
v.setTextViewText(R.id.tv_artist_name, currentArtist);
CassetteWidgetProvider.setupClicks(this, v);
mgr.updateAppWidget(id, v);
}
}
}
