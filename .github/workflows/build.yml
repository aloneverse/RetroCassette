cat << 'EOF' > app/src/main/java/com/retro/cassettewidget/CassetteWidgetProvider.java
package com.retro.cassettewidget;
import android.app.PendingIntent;
import android.appwidget.AppWidgetManager;
import android.appwidget.AppWidgetProvider;
import android.content.Context;
import android.content.Intent;
import android.graphics.Bitmap;
import android.widget.RemoteViews;
public class CassetteWidgetProvider extends AppWidgetProvider {
public static final String ACTION_PLAY_PAUSE = "com.retro.cassettewidget.ACTION_PLAY_PAUSE";
public static final String ACTION_NEXT = "com.retro.cassettewidget.ACTION_NEXT";
public static final String ACTION_OPEN_APP = "com.retro.cassettewidget.ACTION_OPEN_APP";
public static void setupClicks(Context ctx, RemoteViews v) {
int f = PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE;
PendingIntent pOpen = PendingIntent.getBroadcast(ctx, 0, new Intent(ctx, CassetteWidgetProvider.class).setAction(ACTION_OPEN_APP), f);
v.setOnClickPendingIntent(R.id.widget_root, pOpen);
v.setOnClickPendingIntent(R.id.btn_open_app, pOpen);
v.setOnClickPendingIntent(R.id.btn_play_pause, PendingIntent.getBroadcast(ctx, 1, new Intent(ctx, CassetteWidgetProvider.class).setAction(ACTION_PLAY_PAUSE), f));
v.setOnClickPendingIntent(R.id.btn_next, PendingIntent.getBroadcast(ctx, 2, new Intent(ctx, CassetteWidgetProvider.class).setAction(ACTION_NEXT), f));
}
@Override
public void onUpdate(Context ctx, AppWidgetManager mgr, int[] ids) {
Bitmap bg = CassetteRenderer.renderCassette(0f, MusicNotificationListener.isPlaying);
Bitmap art = (MusicNotificationListener.currentAlbumArt != null) ? MusicNotificationListener.currentAlbumArt : CassetteRenderer.defaultArt();
for (int id : ids) {
RemoteViews v = new RemoteViews(ctx.getPackageName(), R.layout.widget_cassette);
v.setImageViewBitmap(R.id.iv_cassette_bg, bg);
v.setImageViewBitmap(R.id.iv_album_art, art);
v.setTextViewText(R.id.tv_song_title, MusicNotificationListener.currentTitle);
v.setTextViewText(R.id.tv_artist_name, MusicNotificationListener.currentArtist);
setupClicks(ctx, v);
mgr.updateAppWidget(id, v);
}
}
@Override
public void onReceive(Context ctx, Intent intent) {
super.onReceive(ctx, intent);
String act = intent.getAction();
if (ACTION_PLAY_PAUSE.equals(act) && MusicNotificationListener.activeController != null) {
if (MusicNotificationListener.isPlaying) MusicNotificationListener.activeController.getTransportControls().pause();
else MusicNotificationListener.activeController.getTransportControls().play();
} else if (ACTION_NEXT.equals(act) && MusicNotificationListener.activeController != null) {
MusicNotificationListener.activeController.getTransportControls().skipToNext();
} else if (ACTION_OPEN_APP.equals(act)) {
String pkg = MusicNotificationListener.currentPackage;
Intent i = (pkg != null) ? ctx.getPackageManager().getLaunchIntentForPackage(pkg) : null;
if (i == null) i = Intent.makeMainSelectorActivity(Intent.ACTION_MAIN, Intent.CATEGORY_APP_MUSIC);
if (i != null) { i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK); try { ctx.startActivity(i); } catch (Exception ignored) {} }
}
}
}
